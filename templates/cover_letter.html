@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
:root{--accent:#2C3036;--ink:#1B1B1B;--muted:#6E6E73;--rule:#E4E1DA;--paper:#FCFBF9;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);}
body{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;color:var(--ink);font-size:12px;line-height:1.42;
  background:var(--paper);-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.letter{max-width:7.2in;margin:0 auto;padding:0.4in 0.6in;}
.center{text-align:center;}
h1{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;font-size:24px;letter-spacing:.3px;color:var(--ink);margin:0;font-weight:700;}
.role{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:8.8px;letter-spacing:2.4px;text-transform:uppercase;margin:5px 0 8px;}
.contact{font-family:'IBM Plex Mono',monospace;font-size:8.8px;color:var(--muted);}
.contact a{color:var(--muted);text-decoration:none;}
.ci{white-space:nowrap;margin:0 6px;display:inline-block;}
.ic{vertical-align:-1.7px;margin-right:3px;}
.rule{border-bottom:1px solid var(--rule);margin:12px 0 15px;}
.meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);line-height:1.6;margin-bottom:13px;}
.re{font-weight:600;color:var(--accent);margin:0 0 12px;}
p{margin:0 0 8px;}
.sign{margin-top:15px;}
.sign .nm{font-weight:600;color:var(--ink);}
@page{size:A4;margin:0;}
@media print{.letter{padding:12mm 18mm;background:var(--paper);}}
</style></head>
