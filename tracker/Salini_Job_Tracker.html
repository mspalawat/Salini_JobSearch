<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salini · Job Application Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap');
:root{--bg:#FDF2F8;--card:#FFFFFF;--ink:#46061F;--muted:#9D6B80;--rule:#F5D0E1;--accent:#DB2777;--accent-soft:#FCE7F3;}
*{box-sizing:border-box;margin:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;padding:32px 24px 64px;}
.wrap{max-width:1100px;margin:0 auto;}
h1{font-family:'Inter Tight',sans-serif;font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.02em;}
.sub{color:var(--muted);font-size:13px;margin:4px 0 24px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
.tile{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(70,6,31,.06);}
.tile .k{font-size:12px;color:var(--muted);font-weight:500;}
.tile .v{font-family:'Inter Tight',sans-serif;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
.tile .v small{font-size:14px;color:var(--muted);font-weight:600;}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(70,6,31,.06);margin-bottom:24px;}
.card h2{font-family:'Inter Tight',sans-serif;font-size:15px;font-weight:600;margin-bottom:12px;}
.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;background:var(--accent-soft);gap:2px;}
.bar div{transition:opacity .15s ease-out;}
.bar div:hover{opacity:.82;}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--ink);}
.legend span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.actions li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px;}
.actions li:last-child{border-bottom:0;}
.due{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
.due.over{color:#9F1239;font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.chips button{font:inherit;font-size:12px;font-weight:500;padding:6px 12px;border-radius:9999px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;}
.chips button:hover{border-color:var(--accent);}
.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-family:'Inter Tight',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--rule);cursor:pointer;user-select:none;white-space:nowrap;}
th:hover{color:var(--accent);}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top;font-variant-numeric:tabular-nums;}
tr:hover td{background:var(--bg);}
.co{font-weight:600;}
.role{color:var(--muted);font-size:12px;}
.pill{display:inline-block;padding:2px 10px;border-radius:9999px;color:#fff;font-size:11px;font-weight:600;}
details{margin-top:6px;}
summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:500;}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.jd{font-size:12px;color:var(--ink);background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:6px;white-space:pre-wrap;}
.meta{font-size:12px;color:var(--muted);margin-top:4px;}
@media (max-width:720px){.hide-sm{display:none;}}
@media print{body{background:#fff;padding:0;} .card,.tile{box-shadow:none;border:1px solid var(--rule);}}
</style></head><body><div class="wrap">
<h1>Salini · Job Application Tracker</h1>
<p class="sub">Rebuilt 05 Nov 2026 from salini_jobs.csv — every figure below is computed from the table, nothing is hardcoded.</p>
<div class="tiles" id="tiles"></div>
<div class="card"><h2>Pipeline by status</h2><div class="bar" id="bar" role="img" aria-label="Applications by status"></div><div class="legend" id="legend"></div></div>
<div class="card"><h2>Next actions</h2><ul class="actions" id="actions"></ul></div>
<div class="card"><h2>Applications</h2><div class="chips" id="chips"></div>
<table aria-label="Applications table"><thead><tr>
<th data-k="company">Company / Role</th><th data-k="status">Status</th><th data-k="priority" class="hide-sm">Priority</th>
<th data-k="fit_score">Fit</th><th data-k="deadline">Deadline</th><th data-k="date_applied" class="hide-sm">Applied</th>
<th data-k="resume_variant" class="hide-sm">Resume</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div>
<script>
const DATA=[{"id": "1", "company": "PhillipCapital (Phillip Nova)", "role": "Market Analyst (Equities)", "location": "Singapore", "work_mode": "On-site", "source_url": "https://www.phillip.com.sg/sg/careers/market-analyst-equities/", "date_added": "2026-07-29", "deadline": "", "date_applied": "", "status": "Prepared", "priority": "High", "fit_score": "7.6", "resume_variant": "Resume_Salini_Sadangi_Finance", "cover_letter_path": "applications/PhillipCapital_MarketAnalyst_Equities/CoverLetter_Salini_Sadangi_PhillipCapital.pdf", "salary_range": "Negotiable (stated in email)", "contact_person": "recruitment@phillip.com.sg", "next_action": "Send application email with resume + cover letter", "next_action_due": "", "interview_round": "", "interview_date": "", "interviewer": "", "interview_outcome": "", "prep_doc": "applications/PhillipCapital_MarketAnalyst_Equities/PanelReview_Scores_and_Fixes.txt", "jd_summary": "Entry-level equities analyst: daily/weekly market commentary, investor education content, webinars and media; CMFAS 1A/2A/M5/M6/M6A required.", "jd_full": "Phillip Nova (a member of PhillipCapital) - Market Analyst (Equities). Entry-level role for fresh graduates. Conduct fundamental and technical analysis of global equities, ETFs, indices. Monitor macro developments, central bank policies, geopolitical events. Prepare Daily/Weekly/Monthly market commentaries. Curate market trend articles and investor education content. Support branding and media profile; work with Marketing on client acquisition. Represent the firm in webinars, seminars, panels, media interviews. Requirements: Diploma/Degree/Masters in Finance, Economics, Banking or related; knowledge of fundamental AND technical analysis; excellent communication; public speaking; proactive on social media/digital presence; cross-functional work with Sales/Marketing/Product; Bloomberg/TradingView/Reuters familiarity an advantage; must possess or be willing to obtain CMFAS 1A, 2A, M5, M6, M6A; ability to leverage AI tools (ChatGPT, Bloomberg AI, Power BI, Python automation) responsibly. Apply with cover letter, resume, position, present and expected salaries to recruitment@phillip.com.sg.", "notes": "3-persona panel round 4: 7.6/10, HR shortlist YES. Interview prep: own a solo stock call, TradingView TA practice, Fujitec stake math, agree who-built-what on shared projects."}, {"id": "2", "company": "qlub", "role": "Finance Intern", "location": "Singapore", "work_mode": "On-site", "source_url": "", "date_added": "2026-07-30", "deadline": "2026-08-27", "date_applied": "", "status": "Prepared", "priority": "High", "fit_score": "", "resume_variant": "Resume_Salini_Sadangi_Qlub_Finance", "cover_letter_path": "", "salary_range": "Standard intern rate", "contact_person": "", "next_action": "Await portal CV requirement; apply before deadline", "next_action_due": "2026-08-27", "interview_round": "", "interview_date": "", "interviewer": "", "interview_outcome": "", "prep_doc": "", "jd_summary": "Reconciliation of transactions and merchant payouts, invoicing, collections, payment tracking at a Mastercard-backed restaurant payments fintech. Aug 17 - Oct 23.", "jd_full": "qlub - Finance Intern, Singapore. Fast-scaling restaurant payments fintech (Pay-at-Table QR, Digital Menus, Order-and-Pay, Payment Links, SoftPOS) backed by Mastercard, Mubadala, e& and Shorooq; $72M raised. Own: daily and monthly reconciliation of transactions and merchant payouts; investigate and resolve payout discrepancies with internal teams and external partners; prepare monthly merchant invoices with precision and timeliness; track payment flows, settlement status and outstanding balances; act as merchant point of contact for billing/payout/invoice queries; coordinate with vendors and payment partners to verify transaction data and settlement details; verify incoming payments against invoices (collections) and chase overdue payments; maintain audit-ready documentation. Need: pursuing degree/diploma in Finance, Accounting, Business or related; loves numbers with a detective spirit for discrepancies; proficient in Excel; great communicator; organised, detail-oriented, multitasker in fast-paced startup. Nice to have: payments, fintech, hospitality tech or high-growth marketplace experience.", "notes": "Resume tailored to reconciliation/GST/TDS experience at F&B SME. No CV required on portal yet per user."}, {"id": "3", "company": "qlub", "role": "Merchant Success & Operations Intern", "location": "Singapore", "work_mode": "On-site", "source_url": "", "date_added": "2026-07-30", "deadline": "2026-08-27", "date_applied": "", "status": "Prepared", "priority": "Medium", "fit_score": "", "resume_variant": "Resume_Salini_Sadangi_Qlub_Operations", "cover_letter_path": "", "salary_range": "Standard intern rate", "contact_person": "", "next_action": "Await portal CV requirement; apply before deadline", "next_action_due": "2026-08-27", "interview_round": "", "interview_date": "", "interviewer": "", "interview_outcome": "", "prep_doc": "", "jd_summary": "F&B merchant onboarding, training coordination, relationship management and usage reporting. ID 472349. Aug 17 - Oct 23.", "jd_full": "qlub - Merchant Success & Operations Intern, Singapore (ID 472349). Internship Aug 17 - Oct 23, 2026; application deadline Aug 27, 2026. Support operational onboarding of new F&B merchants onto the qlub platform; organise and coordinate merchant training sessions; build and maintain merchant relationships, assist with queries and optimise platform usage; work with operations and product teams on feedback and service improvements; monitor platform integrations and report on merchant usage; conduct research and prepare reports / analyse industry trends; provide administrative support to the Merchant Success & Operations team. Who: done this in a fast-moving high-growth environment; moves fast with incomplete information; real ownership, thinks like an operator; energised by payments, hospitality, customer experience. Need: degree/diploma in Business, Operations, Hospitality or related; passionate about technology, startups, F&B; strong problem-solving; great communicator; organised, detail-oriented, multitasker. Nice to have: payments/fintech/hospitality tech/marketplace experience.", "notes": "Resume leads with 2 years inside an F&B business. Madhvendra interviewing for the same role (separate application)."}, {"id": "4", "company": "Vialto Partners", "role": "Tax Associate (Global Mobility Tax)", "location": "Singapore", "work_mode": "Hybrid", "source_url": "", "date_added": "2026-07-31", "deadline": "", "date_applied": "", "status": "Prepared", "priority": "High", "fit_score": "", "resume_variant": "Resume_Salini_Sadangi_Tax_Accounting", "cover_letter_path": "", "salary_range": "", "contact_person": "", "next_action": "Draft cover letter; submit application", "next_action_due": "", "interview_round": "", "interview_date": "", "interviewer": "", "interview_outcome": "", "prep_doc": "", "jd_summary": "Expatriate individual tax compliance and advisory (tax equalisation, treaties, foreign tax credits). 6mo-2yr Singapore tax preferred. AI screens applications.", "jd_full": "Vialto Partners - Tax Associate, Global Mobility Tax, Singapore (Hybrid). Market leader in global mobility services (cross-border tax, immigration, business travel, rewards, remote work); 6,500+ staff, 50+ countries. Responsibilities: prepare and review individual (expatriate) tax returns ensuring compliance with local and international legislation; manage tax equalisation calculations and hypothetical tax assessments; monitor timely submission of returns and payments; advise on international tax issues (treaties, foreign tax credits, double taxation relief); advise on tax-efficient assignment structuring and compensation; help develop global mobility policies; client management (point of contact, work with HR and payroll); research on global tax regulation changes; develop technical training materials; collaborate with global Vialto teams. Requirements: Bachelor's degree; 6 months to 2 years Singapore tax experience preferred (individual tax compliance and consulting focus); Singapore working rights; global mobility / international tax exposure highly regarded but not essential; strong analytical skills; excellent communication; MS Office and Google proficiency; manage multiple priorities and deadlines. Note: AI is used as part of the application process.", "notes": "Strongest experience match: 2 years owning GSTR-1/GSTR-3B + TDS filing cadence. Indian tax, not SG tax - address transferability in cover letter."}, {"id": "5", "company": "Delta Capita", "role": "Structured Products Documentation QA", "location": "Singapore", "work_mode": "", "source_url": "", "date_added": "2026-07-16", "deadline": "", "date_applied": "", "status": "Prepared", "priority": "Medium", "fit_score": "", "resume_variant": "", "cover_letter_path": "coverletters/CoverLetter_Salini_Sadangi_DeltaCapita_QA.pdf", "salary_range": "", "contact_person": "", "next_action": "Confirm whether application was sent; update status", "next_action_due": "", "interview_round": "", "interview_date": "", "interviewer": "", "interview_outcome": "", "prep_doc": "", "jd_summary": "Structured products documentation QA (JD not on file).", "jd_full": "", "notes": "Cover letter prepared ~16 Jul 2026. Status unconfirmed."}, {"id": "6", "company": "Delta Capita", "role": "SME (Structured Products)", "location": "Singapore", "work_mode": "", "source_url": "", "date_added": "2026-07-16", "deadline": "", "date_applied": "", "status": "Prepared", "priority": "Medium", "fit_score": "", "resume_variant": "", "cover_letter_path": "coverletters/CoverLetter_Salini_Sadangi_DeltaCapita_SME.pdf", "salary_range": "", "contact_person": "", "next_action": "Confirm whether application was sent; update status", "next_action_due": "", "interview_round": "", "interview_date": "", "interviewer": "", "interview_outcome": "", "prep_doc": "", "jd_summary": "Subject-matter expert role, structured products (JD not on file).", "jd_full": "", "notes": "Cover letter prepared ~16 Jul 2026. Status unconfirmed."}, {"id": "7", "company": "Goldman Sachs", "role": "Associate, Financial Institutions Group (FIG)", "location": "Singapore", "work_mode": "On-site", "source_url": "", "date_added": "2026-08-06", "deadline": "", "date_applied": "", "status": "Prepared", "priority": "High", "fit_score": "6", "resume_variant": "Resume_Salini_Sadangi_GoldmanSachs_FIG", "cover_letter_path": "applications/GoldmanSachs_FIG_Associate/CoverLetter_Salini_Sadangi_GoldmanSachs.pdf", "salary_range": "", "contact_person": "", "next_action": "Submit via GS careers portal", "next_action_due": "", "interview_round": "", "interview_date": "", "interviewer": "", "interview_outcome": "", "prep_doc": "", "jd_summary": "FIG Associate, Singapore. M&A/equity/debt execution + pitching for banks, insurers, asset managers, specialty finance, fintech across SEA. Wants 1-4 yrs IB/corp fin/M&A, modeling + Excel/PPT.", "jd_full": "As an Associate within the Financial Institutions Group (FIG) team in Singapore, you will play a pivotal role in developing and strengthening client relationships, participating on advisory teams, and structuring and executing a full range of financial transactions. You will work closely with senior bankers to cover financial institutions including banks, insurance companies, asset managers, specialty finance, and financial technology (FinTech) firms across Singapore and the broader Southeast Asia region. Key responsibilities: transaction execution (M&A, equity, and debt transactions for financial institutions, managing due diligence, preparing marketing and valuation materials, coordinating with external advisors); client pitching and presentation (pitch materials and industry analyses). Basic qualifications: Bachelor's degree; 1-4 years of relevant investment banking, corporate finance, or M&A advisory experience; financial modeling, valuation, and analytical skills with high proficiency in Excel and PowerPoint; exceptional interpersonal and communication skills. Preferred: prior FIG transactions in Southeast Asia; understanding of financial institution balance sheets, regulatory capital requirements, and valuation methodologies.", "notes": "Stretch: JD wants 1-4 yrs IB experience; Salini has 2 yrs part-time SME FA + academic deal work. Letter addresses gap head-on."}, {"id": "8", "company": "Clifford Capital", "role": "Infrastructure Finance Internship / Analyst (career fair enquiry)", "location": "Singapore", "work_mode": "On-site", "source_url": "https://www.cliffordcapital.sg/", "date_added": "2026-09-09", "deadline": "", "date_applied": "", "status": "Prepared", "priority": "High", "fit_score": "", "resume_variant": "Resume_Salini_Sadangi_CliffordCapital_Infra", "cover_letter_path": "applications/CliffordCapital_CareerFair_FollowUp/Message_LinkedIn_Salini_Sadangi_CliffordCapital.txt", "salary_range": "", "contact_person": "Avinash (met at SMU Career Fair, 4 Sep 2026)", "next_action": "Send LinkedIn connection note (Stage 1), then Stage 2 message with infra resume attached; fill anchor line", "next_action_due": "2026-09-10", "interview_round": "", "interview_date": "", "interviewer": "", "interview_outcome": "", "prep_doc": "applications/CliffordCapital_CareerFair_FollowUp/Notes_Psychology_Statistics_CliffordCapital.txt", "jd_summary": "No JD. Career fair follow up to Avinash re internship before Jan 2027 graduation or analyst intake after. Clifford Capital = Singapore infrastructure credit platform (origination, distribution, investment; Bayfront IABS; Pierfront private credit).", "jd_full": "", "notes": "LinkedIn channel, not email. Nudge once 17 Sep if no reply. Fujitec framing corrected (pass at ask), MYR 108M Okapi figure removed."}], C={"Prepared": "#B45309", "Applied": "#DB2777", "Interview": "#7C3AED", "Offer": "#059669", "Rejected": "#9F1239"}, ORDER=["Prepared", "Applied", "Interview", "Offer", "Rejected"];
const today=new Date(); today.setHours(0,0,0,0);
const d=s=>s?new Date(s+"T00:00:00"):null;
const fmt=s=>{const x=d(s);return x?x.toLocaleDateString("en-SG",{day:"2-digit",month:"short"}):"—";};
const by=k=>DATA.filter(r=>r.status===k).length;
const sent=DATA.length-by("Prepared");
const resp=sent? (by("Interview")+by("Offer"))/sent : null;
const fits=DATA.map(r=>parseFloat(r.fit_score)).filter(n=>!isNaN(n));
const nextDl=DATA.map(r=>d(r.deadline)).filter(x=>x&&x>=today).sort((a,b)=>a-b)[0];
const tiles=[["Total tracked",DATA.length],["Sent",sent],["Interviews",by("Interview")],["Offers",by("Offer")],
 ["Response rate",resp==null?"—":Math.round(resp*100)+"<small>%</small>"],
 ["Avg fit score",fits.length?(fits.reduce((a,b)=>a+b,0)/fits.length).toFixed(1):"—"],
 ["Next deadline",nextDl?nextDl.toLocaleDateString("en-SG",{day:"2-digit",month:"short"})+` <small>${Math.round((nextDl-today)/864e5)}d</small>`:"—"]];
document.getElementById("tiles").innerHTML=tiles.map(([k,v])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
const bar=document.getElementById("bar"), leg=document.getElementById("legend");
ORDER.forEach(st=>{const n=by(st); if(n){const el=document.createElement("div");
 el.style.cssText=`background:${C[st]};flex:${n} 1 0`; el.title=`${st}: ${n}`; bar.appendChild(el);}
 leg.insertAdjacentHTML("beforeend",`<span><i style="background:${C[st]}"></i>${st} · ${by(st)}</span>`);});
const acts=DATA.filter(r=>r.next_action).map(r=>({t:`${r.company} — ${r.next_action}`,due:r.next_action_due}))
 .sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
document.getElementById("actions").innerHTML=acts.length?acts.map(a=>{const over=a.due&&d(a.due)<today;
 return `<li><span>${a.t}</span><span class="due ${over?"over":""}">${a.due?fmt(a.due)+(over?" · overdue":""):""}</span></li>`;}).join("")
 :"<li>Nothing pending 🎉</li>";
const chipsEl=document.getElementById("chips"); let filter="All", sortK="id", asc=true;
["All",...ORDER].forEach(s=>{const b=document.createElement("button"); b.textContent=s==="All"?`All · ${DATA.length}`:`${s} · ${by(s)}`;
 b.setAttribute("aria-pressed",s===filter); b.onclick=()=>{filter=s;[...chipsEl.children].forEach(x=>x.setAttribute("aria-pressed",x===b));render();};
 chipsEl.appendChild(b);});
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k; asc=(sortK===k)?!asc:true; sortK=k; render();});
function render(){
 const rows=DATA.filter(r=>filter==="All"||r.status===filter)
  .sort((a,b)=>{let x=a[sortK]??"",y=b[sortK]??""; const nx=parseFloat(x),ny=parseFloat(y);
   if(!isNaN(nx)&&!isNaN(ny)){x=nx;y=ny;} const c=x<y?-1:x>y?1:0; return asc?c:-c;});
 document.getElementById("tbody").innerHTML=rows.map(r=>`<tr>
  <td><div class="co">${r.company}</div><div class="role">${r.role}</div>
   <details><summary>Details & JD</summary>
    ${r.jd_summary?`<div class="jd"><b>Summary:</b> ${r.jd_summary}</div>`:""}
    ${r.jd_full?`<div class="jd">${r.jd_full}</div>`:""}
    ${r.notes?`<div class="meta"><b>Notes:</b> ${r.notes}</div>`:""}
    ${r.resume_variant?`<div class="meta"><b>Resume:</b> ${r.resume_variant}</div>`:""}
    ${r.cover_letter_path?`<div class="meta"><b>Cover letter:</b> ${r.cover_letter_path}</div>`:""}
    ${r.prep_doc?`<div class="meta"><b>Prep:</b> ${r.prep_doc}</div>`:""}
    ${r.source_url?`<div class="meta"><a href="${r.source_url}">Job posting ↗</a></div>`:""}
   </details></td>
  <td><span class="pill" style="background:${C[r.status]||"#9D6B80"}">${r.status}</span></td>
  <td class="hide-sm">${r.priority||"—"}</td>
  <td>${r.fit_score||"—"}</td>
  <td>${fmt(r.deadline)}</td>
  <td class="hide-sm">${fmt(r.date_applied)}</td>
  <td class="hide-sm" style="font-size:12px;color:var(--muted)">${(r.resume_variant||"—").replace("Resume_Salini_Sadangi","…")}</td>
 </tr>`).join("");}
render();
</script></body></html>
